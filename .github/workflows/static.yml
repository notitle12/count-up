name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 💡 [여기서부터 추가됨] 깃허브 가상 서버에 Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 💡 [추가] 파이어베이스 등 우리 패키지들 자동 설치
      - name: Install dependencies
        run: npm ci

      # 💡 [추가] 리액트 코드를 브라우저가 읽을 수 있게 dist 폴더로 빌드!
      - name: Build project
        run: npm run build

      # 💡 빌드 완료된 dist 폴더를 업로드 대상으로 지정
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
